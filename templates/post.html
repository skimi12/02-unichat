{% extends "base.html" %} {% block title %}新規投稿 - UniChat{% endblock %} {%
block content %}
<div class="timeline-container">
  <h2>新規投稿</h2>
  <div class="post-form">
    <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-3">
        <label for="content" class="form-label">投稿内容</label>
        <textarea
          class="form-control"
          id="content"
          name="content"
          rows="3"
          maxlength="140"
          required
        ></textarea>
        <div class="char-counter mt-1"><span id="charCount">0</span>/140</div>
      </div>
      <button type="submit" class="btn btn-tweet">投稿する</button>
    </form>
  </div>
</div>
{% endblock %} {% block scripts %}
<script src="{{ url_for('static', filename='post.js') }}" defer></script>
{% endblock %}
